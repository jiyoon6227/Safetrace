# ============================================================
# 테스트 환경 (Oracle 통합 테스트가 @ActiveProfiles("test")로 사용한다. 환경변수가 없으면 해당 테스트는 건너뛴다)
# 개발 DB(SYSTEM)와 분리된 테스트 전용 Oracle 계정을 쓴다.
# 비밀번호는 파일에 적지 않고 환경변수로 받는다.
#   SAFETRACE_TEST_DB_PASSWORD  (필수)
#   SAFETRACE_TEST_DB_USERNAME  (기본 safetrace_test)
#   SAFETRACE_TEST_DB_URL       (기본 jdbc:oracle:thin:@//localhost:1521/XEPDB1 - XE의 PDB 서비스)
# ============================================================

spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${SAFETRACE_TEST_DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${SAFETRACE_TEST_DB_USERNAME:safetrace_test}
    password: ${SAFETRACE_TEST_DB_PASSWORD}
    hikari:
      # 동시성 테스트가 스레드 최대 10개를 쓰므로 연결 풀을 넉넉히 둔다 (테스트 설정에만 적용)
      maximum-pool-size: 20
      connection-timeout: 30000

# 테스트 컨텍스트 로딩용 값 (외부 API는 호출하지 않는다)
groq:
  api-key: test-not-used

app:
  frontend-base-url: http://localhost:5173

logging:
  level:
    com.safetrace: info
    org.springframework.security: info
