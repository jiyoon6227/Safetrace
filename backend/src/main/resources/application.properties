# ============================================================
# 보안 기본 설정 (프로필과 상관없이 항상 적용)
# application.yml(개인 설정·비밀값)과 같은 위치에 있으면 이 파일의 값이 우선한다.
# ============================================================

# nginx 같은 프록시 뒤에서 실제 접속자 IP를 알기 위한 설정.
# 신뢰하는 프록시(같은 서버·사설망)가 붙여준 X-Forwarded-For 값만 인정하고,
# 외부에서 직접 보낸 X-Forwarded-For 헤더는 무시한다. (로그인·인증메일 IP 제한이 이 값을 쓴다)
server.forward-headers-strategy=native

# 오류 응답에 서버 내부 메시지·예외 정보를 담지 않는다.
# (사용자에게 보여줄 한글 안내는 GlobalExceptionHandler가 직접 담아서 보낸다)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
